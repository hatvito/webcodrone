<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoDrone EDU 3D 數位雙胞胎控制台</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans h-screen flex flex-col overflow-hidden">

    <!-- 頂部導覽列 -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center shadow-md z-10">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 bg-red-500 rounded-full animate-pulse" id="connection-indicator"></div>
            <h1 class="text-xl font-bold tracking-wide">CoDrone EDU <span class="text-indigo-400 font-light">Digital Twin</span></h1>
        </div>
        <div class="flex items-center space-x-4">
            <span id="status-text" class="text-sm text-slate-400">尚未連線</span>
            <button id="connect-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2 rounded-lg font-medium transition shadow-lg flex items-center space-x-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                <span>連接序列埠 (USB)</span>
            </button>
        </div>
    </header>

    <!-- 主要內容區 -->
    <div class="flex-1 flex overflow-hidden">
        <!-- 左側：3D 數位雙胞胎視窗 -->
        <div class="flex-1 relative bg-slate-950 flex flex-col">
            <div id="canvas-container" class="flex-1 w-full h-full"></div>
            <div class="absolute bottom-4 left-4 bg-slate-900/80 backdrop-blur border border-slate-700/50 p-3 rounded-lg text-xs space-y-1 text-slate-300 pointer-events-none">
                <p class="font-semibold text-indigo-400">3D 視角說明：</p>
                <p>• 藍色機身即時同步實體無人機之 Roll / Pitch / Yaw 姿態</p>
                <p>• 紅色箭頭代表機頭方向 (Front)</p>
            </div>
        </div>

        <!-- 右側：即時感測器數據面板 -->
        <div class="w-96 bg-slate-800 border-l border-slate-700 flex flex-col p-6 space-y-6 overflow-y-auto shadow-2xl">
            <div>
                <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-3">IMU 姿態數據 (RawMotion)</h2>
                <div class="grid grid-cols-3 gap-3">
                    <div class="bg-slate-900 p-3 rounded-lg border border-slate-700/50 text-center">
                        <span class="text-xs text-slate-500 block">Roll</span>
                        <span id="val-roll" class="text-lg font-mono font-bold text-indigo-400">0.0°</span>
                    </div>
                    <div class="bg-slate-900 p-3 rounded-lg border border-slate-700/50 text-center">
                        <span class="text-xs text-slate-500 block">Pitch</span>
                        <span id="val-pitch" class="text-lg font-mono font-bold text-indigo-400">0.0°</span>
                    </div>
                    <div class="bg-slate-900 p-3 rounded-lg border border-slate-700/50 text-center">
                        <span class="text-xs text-slate-500 block">Yaw</span>
                        <span id="val-yaw" class="text-lg font-mono font-bold text-indigo-400">0.0°</span>
                    </div>
                </div>
            </div>

            <div>
                <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-3">測距雷達 (ToF / Front)</h2>
                <div class="bg-slate-900 p-4 rounded-lg border border-slate-700/50 flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="p-2 bg-indigo-500/10 text-indigo-400 rounded-lg">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
                        </div>
                        <div>
                            <span class="text-xs text-slate-400 block">前方障礙物距離</span>
                            <span id="val-front-range" class="text-xl font-mono font-bold text-emerald-400">--- mm</span>
                        </div>
                    </div>
                    <div id="range-warning" class="w-3 h-3 rounded-full bg-slate-700"></div>
                </div>
            </div>

            <div>
                <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-3">系統控制</h2>
                <div class="space-y-3">
                    <button id="btn-takeoff" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-lg font-medium transition shadow-md">起飛 (Takeoff)</button>
                    <button id="btn-land" class="w-full bg-amber-600 hover:bg-amber-500 text-white py-2.5 rounded-lg font-medium transition shadow-md">降落 (Land)</button>
                    <button id="btn-stop" class="w-full bg-rose-600 hover:bg-rose-500 text-white py-2.5 rounded-lg font-medium transition shadow-md">緊急停止 (Stop)</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 載入模組化腳本 -->
    <script type="module" src="./app.js"></script>
</body>
</html>
