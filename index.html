<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CoDrone EDU 控制台 - 360° 雷達掃描</title>
<style>
:root{--bg:#e8ebe6;--panel:#f5f6f2;--ink:#17262b;--mute:#66767a;--line:#cfd5ce;--teal:#0e6a73;--amber:#a85a00;--red:#b3261e;--con:#10201f;--conink:#cfe3df}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;background:var(--ink);color:#fff}
header h1{font-size:17px;margin:0 auto 0 0;font-weight:650}
button{font:inherit;padding:8px 14px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid #f0b429;outline-offset:2px}
button.primary{background:var(--teal);border-color:var(--teal);color:#fff}
#estop{background:var(--red);border-color:#7d1912;color:#fff;font-weight:700;font-size:16px;padding:10px 22px}
.badge{padding:3px 10px;border-radius:99px;background:#3a4a4f;font-size:13px}
.badge.on{background:var(--teal)}
main{display:grid;gap:14px;padding:14px;max-width:1240px;margin:0 auto}
@media(min-width:960px){main{grid-template-columns:minmax(380px,460px) 1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.panel h2{margin:0 0 10px;font-size:15px}
.col{display:grid;gap:14px;align-content:start}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kv div{background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.kv small{color:var(--mute);display:block}
.kv b{font:600 18px ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.stale{opacity:.4}
.imu{display:grid;grid-template-columns:5.2em 1fr 6.4em;gap:4px 8px;align-items:center;font-size:13px}
.imu .g{grid-column:1/-1;margin-top:8px;font-weight:650;color:var(--teal)}
.imu .v{text-align:right;font:13px ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.bar{position:relative;height:8px;background:#dde2dc;border-radius:4px}
.bar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:#8a9a9d}
.bar i{position:absolute;top:0;bottom:0;background:var(--teal);border-radius:4px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.note{color:var(--mute);font-size:13px;margin:8px 0 0}
.console{display:flex;flex-direction:column;min-height:300px}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:8px;font-size:13px}
.tools button{padding:4px 10px}
#log{flex:1;min-height:200px;max-height:40vh;overflow:auto;background:var(--con);color:var(--conink);border-radius:6px;padding:8px 10px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace}
#log div{white-space:pre-wrap;word-break:break-all}
.tx{color:#8fd3e8}.err{color:#ff9d93}.warn{color:#f2c56b}.info{color:#9fb3ae}
dialog{border:2px solid var(--amber);border-radius:10px;max-width:520px;padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{margin:0 0 8px}
dialog ul{margin:8px 0 14px;padding-left:20px}
dialog .row{display:flex;gap:10px;justify-content:flex-end}
.twin{position:relative;height:320px;background:#e9ede8;border-radius:6px;overflow:hidden}
.twin canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.twin .ov{position:absolute;left:8px;top:8px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;background:rgba(245,246,242,.85);padding:5px 9px;border-radius:5px;white-space:pre;pointer-events:none}
.rcol{display:grid;gap:14px;align-content:start}
.radar-box{text-align:center;background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px}
#radarCanvas{background:#111;border-radius:50%;display:block;margin:0 auto;}
@media(prefers-reduced-motion:no-preference){button{transition:background .12s}}
</style>
</head>
<body>
<header>
  <h1>CoDrone EDU 控制台 - 360° 雷達掃描</h1>
  <span id="conn" class="badge">未連線</span>
  <button id="btnConnect" class="primary">連接控制器</button>
  <button id="btnDisc" disabled>中斷連線</button>
  <button id="estop" disabled title="快捷鍵：Esc">緊急停止</button>
</header>

<main>
  <div class="col">
    <section class="panel">
      <h2>飛行狀態與測距</h2>
      <div class="kv">
        <div><small>電池</small><b id="bat" class="stale">—</b></div>
        <div><small>前方距離</small><b id="frontDist" class="stale">—</b></div>
        <div><small>底部高度</small><b id="alt" class="stale">—</b></div>
        <div><small>飛行模式</small><b id="mode" class="stale" style="font-size:15px">—</b></div>
      </div>
      <p class="note" id="age">尚未收到無人機回應。</p>
      <p class="note" id="rates"></p>
    </section>

    <section class="panel">
      <h2>360° 簡易環境雷達</h2>
      <div class="radar-box">
        <canvas id="radarCanvas" width="280" height="280"></canvas>
        <div class="tools" style="justify-content:center; margin-top:10px;">
          <label><input type="checkbox" id="enableScan" checked> 啟用雷達記錄</label>
          <button id="btnClearRadar">清除雷達圖</button>
        </div>
      </div>
      <p class="note">手持無人機在原地緩慢轉動 360 度，雷達圖會以機頭前方為基準記錄周遭距離。</p>
    </section>

    <section class="panel">
      <h2>飛行控制</h2>
      <div class="btns">
        <button id="btnFirst" disabled>首飛程序</button>
        <button id="btnTakeoff" disabled>起飛</button>
        <button id="btnLand" disabled>降落</button>
      </div>
    </section>
  </div>

  <div class="rcol">
  <section class="panel">
    <h2>數位雙生（即時遙測）</h2>
    <div class="twin" id="twinHost"><canvas id="twinCanvas"></canvas><div class="ov" id="twinOv">未連線</div></div>
    <div class="tools" style="margin:8px 0 0">
      <button id="twinYaw">Yaw 歸零</button><button id="twinClear">清除軌跡</button>
      <label><input type="checkbox" id="flipRoll"> Roll 反向</label>
      <label><input type="checkbox" id="flipPitch"> Pitch 反向</label>
      <label><input type="checkbox" id="flipYaw" checked> Yaw 反向</label>
    </div>
  </section>
  <section class="panel console">
    <h2>主控台</h2>
    <div class="tools">
      <label><input type="checkbox" id="hidePoll" checked> 隱藏輪詢與搖桿封包</label>
      <button id="btnClear">清除</button>
    </div>
    <div id="log" role="log" aria-live="off"></div>
  </section>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ==PROTO-START==
function crc16(bytes, crc = 0) {
  for (const b of bytes) {
    crc ^= b << 8;
    for (let i = 0; i < 8; i++) crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF;
  }
  return crc;
}
function pkt(type, payload, to = 0x10) {
  const h = [type, payload.length, 0x70, to];
  const c = crc16(payload, crc16(h));
  return Uint8Array.from([0x0A, 0x55, ...h, ...payload, c & 255, c >> 8]);
}
const P = {
  req: t => pkt(0x04, [t]),
  cmd: (c, o) => pkt(0x11, [c, o]),
  ctl: (r, p, y, t) => pkt(0x10, [r & 255, p & 255, y & 255, t & 255]),
  takeoff: () => P.cmd(0x07, 0x11),
  land: () => P.cmd(0x07, 0x12),
  stop: () => P.cmd(0x01, 0x00)
};
class Parser {
  constructor() { this.b = []; }
  feed(chunk) {
    const b = this.b, out = [];
    for (const x of chunk) b.push(x);
    for (;;) {
      let i = -1;
      for (let k = 0; k < b.length - 1; k++) if (b[k] === 0x0A && b[k + 1] === 0x55) { i = k; break; }
      if (i < 0) { if (b.length > 1) b.splice(0, b.length - 1); break; }
      if (i > 0) b.splice(0, i);
      if (b.length < 6) break;
      const len = b[3];
      if (len > 128) { b.splice(0, 2); continue; }
      const total = 8 + len;
      if (b.length < total) break;
      const f = b.slice(0, total);
      if (crc16(f.slice(2, total - 2)) === (f[total - 2] | (f[total - 1] << 8))) {
        out.push({ type: f[2], from: f[4], to: f[5], data: f.slice(6, total - 2), raw: f });
        b.splice(0, total);
      } else b.splice(0, 2);
    }
    return out;
  }
}
// ==PROTO-END==

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const hex = a => Array.from(a, x => x.toString(16).padStart(2, '0').toUpperCase()).join(' ');
const sgn = v => v > 127 ? v - 256 : v;
const T_STATE = 0x40, T_RANGE = 0x45, T_MOTION = 0x44, T_RAW = 0x30, T_POS = 0x42, T_JOY = 0x71;
const NAMES = { [T_STATE]: 'State', [T_RANGE]: 'Range', [T_MOTION]: 'Motion', [T_RAW]: 'RawMotion', [T_POS]: 'Position', [T_JOY]: 'Joystick' };
const FLIGHT = { 0x10: '待命', 0x11: '啟動中', 0x12: '起飛中', 0x13: '飛行中', 0x14: '降落中', 0x15: '翻滾', 0x16: '反向', 0x20: '已停止', 0x30: '意外', 0x31: '錯誤' };

let port, reader, writer, readDone;
let connected = false;
const st = { flight: null, battery: null, t: 0, yaw: 0, front: 0 };

// ---------- 雷達圖初始化與繪製 ----------
const radarCv = $('radarCanvas'), ctx = radarCv.getContext('2d');
const radarPoints = [];
$('btnClearRadar').onclick = () => { radarPoints.length = 0; drawRadar(); };

function drawRadar() {
  const w = radarCv.width, h = radarCv.height, cx = w / 2, cy = h / 2;
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, w, h);

  // 畫同心圓網格 (代表距離，例如 50cm, 100cm, 200cm)
  ctx.strokeStyle = '#225522';
  ctx.lineWidth = 1;
  [0.5, 1.0, 2.0].forEach(m => {
    const r = (m * 1000 / 2500) * (w / 2); // 假設最大量測 2.5公尺
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = '#448844';
    ctx.font = '9px monospace';
    ctx.fillText(m + 'm', cx + 4, cy - r + 10);
  });

  // 十字線
  ctx.strokeStyle = '#224422';
  ctx.beginPath();
  ctx.moveTo(0, cy); ctx.lineTo(w, cy);
  ctx.moveTo(cx, 0); ctx.lineTo(cx, h);
  ctx.stroke();

  // 畫出累積的掃描點
  ctx.fillStyle = '#3ddc84';
  for (const pt of radarPoints) {
    // pt.yaw 為角度，pt.dist 為 mm
    if (pt.dist <= 0) continue;
    const rad = (pt.yaw - 90) * (Math.PI / 180); // 讓 0 度朝上 (正前方)
    const maxDist = 2500; // 2.5m 最大半徑
    const r = Math.min(1, pt.dist / maxDist) * (w / 2);
    const px = cx + r * Math.cos(rad);
    const py = cy + r * Math.sin(rad);
    ctx.fillRect(px - 1.5, py - 1.5, 3, 3);
  }

  // 畫中心機身指示
  ctx.fillStyle = '#d6382c';
  ctx.beginPath();
  ctx.arc(cx, cy, 4, 0, Math.PI * 2);
  ctx.fill();
}
drawRadar();

const logEl = $('log');
function log(kind, text) {
  const d = document.createElement('div');
  d.className = kind;
  const t = new Date();
  d.textContent = t.toTimeString().slice(0, 8) + '.' + String(t.getMilliseconds()).padStart(3, '0') + '  ' + text;
  const near = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 40;
  logEl.appendChild(d);
  while (logEl.childElementCount > 600) logEl.firstChild.remove();
  if (near) logEl.scrollTop = logEl.scrollHeight;
}
$('btnClear').onclick = () => { logEl.textContent = ''; };

function send(bytes) {
  if (!writer) return Promise.resolve();
  return writer.write(bytes).catch(e => { log('err', '寫入失敗：' + e.message); });
}
const poll = t => send(P.req(t));

function i16(data) { const v = new DataView(Uint8Array.from(data).buffer); return n => v.getInt16(n * 2, true); }
const hits = {};

function onFrame(f) {
  (hits[f.type] = hits[f.type] || []).push(performance.now());
  const polled = [T_STATE, T_RANGE, T_MOTION, T_RAW, T_POS, T_JOY].includes(f.type);
  const now = performance.now();
  let note = '';
  
  if (f.type === T_STATE && f.data.length === 8) {
    st.flight = f.data[1]; st.battery = f.data[7]; st.t = now; twin.flight(st.flight);
    $('bat').textContent = st.battery + ' %';
    $('mode').textContent = FLIGHT[st.flight] || '0x' + st.flight.toString(16);
    $('bat').classList.remove('stale'); $('mode').classList.remove('stale');
  } else if (f.type === T_RANGE && f.data.length === 12) {
    const getS16 = i16(f.data);
    st.front = getS16(1); // front mm
    const bottom = getS16(5); // bottom mm
    
    twin.bottom(bottom);
    $('frontDist').textContent = st.front > 0 ? (st.front / 10).toFixed(1) + ' cm' : '—';
    $('frontDist').classList.toggle('stale', !(st.front > 0));
    $('alt').textContent = bottom > 0 ? (bottom / 10).toFixed(1) + ' cm' : '—';
    $('alt').classList.toggle('stale', !(bottom > 0));

    // 如果開啟掃描，記錄當前 Yaw 與 Front 距離
    if ($('enableScan').checked && st.front > 0) {
      radarPoints.push({ yaw: st.yaw, dist: st.front });
      if (radarPoints.length > 500) radarPoints.shift(); // 限制最多 500 點
      drawRadar();
    }
    note = 'front = ' + st.front + ' mm';
  } else if (f.type === T_MOTION && f.data.length === 18) {
    const g = i16(f.data);
    st.yaw = g(8); // angleYaw
    twin.att(g(6), g(7), st.yaw);
    note = 'yaw = ' + st.yaw + '°';
  } else {
    return;
  }
  if (!(polled && $('hidePoll').checked)) log('rx', 'RX  ' + hex(f.raw) + '   ' + NAMES[f.type] + '：' + note);
}

async function readLoop() {
  const parser = new Parser();
  try {
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      if (value) for (const f of parser.feed(value)) onFrame(f);
    }
  } catch (e) { if (connected) log('err', '讀取中斷：' + e.message); }
  finally { reader.releaseLock(); }
}

async function pollLoop() {
  let i = 0;
  while (connected) {
    const seq = [T_MOTION, T_RANGE, T_STATE];
    poll(seq[i++ % seq.length]);
    await sleep(40);
  }
}

function initTwin() {
  const noop = () => {};
  const stub = { att: noop, bottom: noop, pos: noop, flight: noop, reset: noop, zeroYaw: noop, clearTrail: noop };
  const host = $('twinHost'), cv = $('twinCanvas'), ov = $('twinOv');
  if (!window.THREE) return stub;
  let R;
  try { R = new THREE.WebGLRenderer({ canvas: cv, antialias: true }); } catch (e) { return stub; }
  R.setPixelRatio(Math.min(devicePixelRatio || 1, 2));

  const d = { att: null, bottom: null, pos: null, flight: null, yawZero: 0 };
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xe9ede8);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a9a9d, 0.95));
  const sun = new THREE.DirectionalLight(0xffffff, 0.7); sun.position.set(2, 4, 3); scene.add(sun);
  scene.add(new THREE.GridHelper(4, 16, 0x8fa0a3, 0xc2cbc5));

  const drone = new THREE.Group(); drone.rotation.order = 'YXZ'; drone.scale.setScalar(0.28);
  const model = new THREE.Group(); drone.add(model);
  const mat = color => new THREE.MeshStandardMaterial({ color, roughness: 0.65, metalness: 0.05 });
  model.add(new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.16, 0.86), mat(0x2a2f31)));

  const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 50);
  const V0 = { th: 0.7, ph: 1.05, dist: 3.2 }; let v = Object.assign({}, V0);
  const target = new THREE.Vector3(0, 0.4, 0);
  let drag = null;
  cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointerup', () => { drag = null; });
  cv.addEventListener('pointermove', e => {
    if (!drag) return;
    v.th -= (e.clientX - drag.x) * 0.008; v.ph = Math.max(0.15, Math.min(1.5, v.ph - (e.clientY - drag.y) * 0.008));
    drag = { x: e.clientX, y: e.clientY };
  });
  cv.addEventListener('wheel', e => { e.preventDefault(); v.dist = Math.max(1.2, Math.min(8, v.dist * (e.deltaY > 0 ? 1.1 : 0.9))); }, { passive: false });
  new ResizeObserver(() => {
    const w = host.clientWidth, h = host.clientHeight;
    R.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }).observe(host);

  const eul = new THREE.Euler(0, 0, 0, 'YXZ'), tq = new THREE.Quaternion();
  const rad = Math.PI / 180;

  function frame() {
    requestAnimationFrame(frame);
    if (d.att) {
      eul.set(-($('flipPitch').checked ? -1 : 1) * d.att.p * rad, ($('flipYaw').checked ? -1 : 1) * (d.att.y - d.yawZero) * rad, -($('flipRoll').checked ? -1 : 1) * d.att.r * rad);
      tq.setFromEuler(eul);
    } else tq.identity();
    drone.quaternion.slerp(tq, 0.3);

    target.lerp(new THREE.Vector3(drone.position.x, Math.max(drone.position.y, 0.3), drone.position.z), 0.1);
    camera.position.set(target.x + v.dist * Math.sin(v.ph) * Math.sin(v.th), target.y + v.dist * Math.cos(v.ph), target.z + v.dist * Math.sin(v.ph) * Math.cos(v.th));
    camera.lookAt(target);
    R.render(scene, camera);
  }
  requestAnimationFrame(frame);

  return {
    att: (r, p, y) => { d.att = { t: performance.now(), r, p, y }; },
    bottom: mm => { d.bottom = { t: performance.now(), mm }; },
    pos: (x, y, z) => {},
    flight: fl => { d.flight = { t: performance.now(), v: fl }; },
    zeroYaw: () => { if (d.att) d.yawZero = d.att.y; },
    clearTrail: () => {},
    reset: () => { d.att = d.bottom = null; d.yawZero = 0; }
  };
}
const twin = initTwin();
$('twinYaw').onclick = () => twin.zeroYaw();
$('twinClear').onclick = () => twin.clearTrail();

function setUi() {
  $('conn').textContent = connected ? '已連線' : '未連線';
  $('conn'].classList.toggle('on', connected);
  $('btnConnect').disabled = connected;
  $('btnDisc').disabled = !connected;
  $('estop').disabled = !connected;
}
async function connect() {
  if (!('serial' in navigator)) return;
  port = await navigator.serial.requestPort({ filters: [{ usbVendorId: 0x0483 }] });
  await port.open({ baudRate: 57600 });
  writer = port.writable.getWriter();
  reader = port.readable.getReader();
  connected = true; setUi();
  readDone = readLoop();
  pollLoop();
}
async function disconnect() {
  connected = false;
  try { await reader.cancel(); await readDone; await writer.releaseLock(); await port.close(); } catch (e) {}
  writer = reader = null; setUi();
}
$('btnConnect').onclick = connect;
$('btnDisc').onclick = disconnect;
setUi();
</script>
</body>
</html>
